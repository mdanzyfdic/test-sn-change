name: SNOW Change - Direct API

on:
  workflow_dispatch:

jobs:
  deploy-direct-api:
    name: Deploy Direct API
    runs-on: ubuntu-latest

    steps:
      - name: Build time window for direct API
        id: window_direct_api
        shell: bash
        run: |
          START_DATE="$(date -u '+%Y-%m-%d %H:%M:%S')"
          END_DATE="$(date -u -d '+2 hours' '+%Y-%m-%d %H:%M:%S')"

          echo "start_date=$START_DATE" >> "$GITHUB_OUTPUT"
          echo "end_date=$END_DATE" >> "$GITHUB_OUTPUT"

      - name: Create ServiceNow change with direct API
        id: create_change_direct_api
        shell: bash
        env:
          SN_INSTANCE_URL: ${{ secrets.SN_INSTANCE_URL }}
          SN_ACCESS_TOKEN: ${{ secrets.SN_ACCESS_TOKEN }}
          START_DATE: ${{ steps.window_direct_api.outputs.start_date }}
          END_DATE: ${{ steps.window_direct_api.outputs.end_date }}
        run: |
          cat > payload.json <<EOF
          {
            "chg_model": "DevOps Simplified",
            "state": "New",
            "short_description": "GitHub deployment via direct API for ${{ github.repository }}",
            "description": "Automated deployment triggered from GitHub Actions using the direct ServiceNow Table API. Repository=${{ github.repository }}, Workflow=${{ github.workflow }}, Run ID=${{ github.run_id }}, Run Number=${{ github.run_number }}, Actor=${{ github.actor }}, Ref=${{ github.ref_name }}, SHA=${{ github.sha }}",
            "justification": "Deployment is required to promote validated code.",
            "implementation_plan": "Deploy approved artifact and validate health checks.",
            "backout_plan": "Rollback to previous version.",
            "test_plan": "Smoke tests and health checks.",
            "category": "Software",
            "priority": "2",
            "assignment_group": "Change Management",
            "business_service": "Customer Portal",
            "cmdb_ci": "web-prod-01",
            "requested_by": "automation.user",
            "start_date": "$START_DATE",
            "end_date": "$END_DATE",
            "work_notes": "Initial workload set to New."
          }
          EOF

          RESPONSE=$(curl --silent --show-error --fail \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer $SN_ACCESS_TOKEN" \
            --request POST \
            "$SN_INSTANCE_URL/api/now/table/change_request?sysparm_input_display_value=true&sysparm_display_value=all" \
            --data @payload.json)

          echo "$RESPONSE"

          CHANGE_NUMBER=$(echo "$RESPONSE" | jq -r '.result.number.display_value // .result.number.value // .result.number')
          CHANGE_SYS_ID=$(echo "$RESPONSE" | jq -r '.result.sys_id.value // .result.sys_id')

          echo "change_number=$CHANGE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "change_sys_id=$CHANGE_SYS_ID" >> "$GITHUB_OUTPUT"

      - name: Print created change from direct API
        run: |
          echo "Change Number: ${{ steps.create_change_direct_api.outputs.change_number }}"
          echo "Change Sys ID: ${{ steps.create_change_direct_api.outputs.change_sys_id }}"
