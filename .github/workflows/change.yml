name: SNOW Change - DevOps Action

on:
  workflow_dispatch:

jobs:
  get-approval:
    name: Awaiting Change Approval
    runs-on: ubuntu-latest
    environment: change-approval  # Configure required reviewers on this environment in repo Settings → Environments
    steps:
      - run: echo "Approval gate passed"

  deploy-devops-action:
    name: Deploy DevOps Action
    needs: get-approval
    runs-on: ubuntu-latest

    steps:
      - name: Build time window for DevOps action
        id: window_devops_action
        shell: bash
        run: |
          START_DATE="$(date -u '+%Y-%m-%d %H:%M:%S')"
          END_DATE="$(date -u -d '+2 hours' '+%Y-%m-%d %H:%M:%S')"

          echo "start_date=$START_DATE" >> "$GITHUB_OUTPUT"
          echo "end_date=$END_DATE" >> "$GITHUB_OUTPUT"

      - name: Create ServiceNow change with DevOps action
        id: create_change_devops_action
        uses: ServiceNow/servicenow-devops-change@v6.3.0
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: 'Deploy DevOps Action'
          change-request: >-
            {
              "attributes": {
                "chg_model": {"name": "DevOps"},
                "short_description": "GitHub deployment via DevOps action for ${{ github.repository }}",
                "description": "Automated deployment triggered from GitHub Actions using the ServiceNow DevOps action. Repository=${{ github.repository }}, Workflow=${{ github.workflow }}, Run ID=${{ github.run_id }}, Run Number=${{ github.run_number }}, Actor=${{ github.actor }}, Ref=${{ github.ref_name }}, SHA=${{ github.sha }}",
                "justification": "Deployment is required to promote validated code to the target environment.",
                "implementation_plan": "1. Pull approved artifact 2. Deploy application 3. Run smoke checks 4. Validate service health",
                "backout_plan": "Rollback to previous known-good version and validate service recovery.",
                "test_plan": "Run automated smoke tests, API health checks, and post-deploy validation.",
                "category": "Software",
                "priority": "2",
                "start_date": "${{ steps.window_devops_action.outputs.start_date }}",
                "end_date": "${{ steps.window_devops_action.outputs.end_date }}",
                "requested_by_date": "${{ steps.window_devops_action.outputs.start_date }}",
                "work_notes": "Change approved by GitHub user: ${{ github.actor }} prior to pipeline execution. Automated deployment initiated via GitHub Actions."
              }
            }
          interval: '30'
          timeout: '3600'
          changeCreationTimeOut: '600'
          abortOnChangeCreationFailure: true
          abortOnChangeStepTimeout: true

      - name: Debug ServiceNow outputs
        run: |
          echo "change-request-number=${{ steps.create_change_devops_action.outputs.change-request-number }}"
          echo "change-request-sys-id=${{ steps.create_change_devops_action.outputs.change-request-sys-id }}"

      - name: Close ServiceNow change request
        uses: ServiceNow/servicenow-devops-change@v6.3.0
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: 'Deploy DevOps Action'
          change-request: >-
            {
              "setCloseCode": "true",
              "attributes": {
                "state": "3",
                "close_code": "successful",
                "close_notes": "Change successfully completed via automated GitHub Actions pipeline. Approved by: ${{ github.actor }}. Repository: ${{ github.repository }}, Workflow: ${{ github.workflow }}, Run: ${{ github.run_id }}, SHA: ${{ github.sha }}."
              }
            }
          interval: '30'
          timeout: '3600'
          changeCreationTimeOut: '600'
          abortOnChangeCreationFailure: true
          abortOnChangeStepTimeout: true

      - name: Print created change from DevOps action
        run: |
          echo "Change Number: ${{ steps.create_change_devops_action.outputs.change-request-number }}"
          echo "Change Sys ID: ${{ steps.create_change_devops_action.outputs.change-request-sys-id }}"

      - run: echo "Deployment Finished....."
